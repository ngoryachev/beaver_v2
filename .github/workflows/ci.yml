name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # The migration is applied to the shared production database on deploy,
      # so it is checked against a throwaway Postgres first (twice, for
      # idempotency). The script skips rather than pulls a missing image, so
      # the image is fetched here.
      - run: docker pull postgres:16-alpine

      - run: test/sql/migration_test.sh

  # Beaver shares the VPS, gateway and database with priority-lists; see
  # docs/deploy.md. Same steps as scripts/apply_migration.sh and
  # scripts/deploy_web.sh.
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: >
          flutter build web --release
          --base-href /beaver/
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          name: deploy_key
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Before the web build goes out: the new build may already read the new
      # columns. Every migration is idempotent, so all of them run every time.
      - name: Apply migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "==> $migration"
            ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              'cd /opt/priority-lists/supabase && docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1' \
              < "$migration"
          done
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/priority-lists/supabase && docker compose exec -T db psql -U postgres -d postgres -c \"NOTIFY pgrst, 'reload schema';\""

      - name: Upload build
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'mkdir -p /opt/beaver/web'
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            build/web/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/beaver/web/
